<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" width="1200" height="1040">
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827}</style>
<defs>
<marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
<marker id="purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
</defs>
<rect width="1200" height="1040" fill="#ffffff"/>
<text x="40" y="47" font-size="30" font-weight="600" fill="#111827">默认本地装配 · 内核简单，能力灵活</text>
<text x="40" y="80" font-size="18" font-weight="400" fill="#6b7280">只提供身份、配置、模型与目录即可启动；替换某项能力，不重建整套业务运行时。</text>
<rect x="240" y="120" width="720" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="256" y="149" font-size="20" font-weight="600" fill="#111827">localapp.Open(Profile, Models, Directory)</text>
<text x="256" y="177" font-size="16" font-weight="400" fill="#6b7280">默认无需注册工厂；Profile 明确身份与场景，接入已有模型。</text>
<path d="M600 212 V280" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="612" y="233" width="130" height="26" rx="4" fill="#ffffff" opacity=".97"/>
<text x="617" y="251" font-size="15" font-weight="400" fill="#6b7280">默认装配</text>
<rect x="40" y="280" width="1120" height="132" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="56" y="309" font-size="20" font-weight="600" fill="#111827">Entry + 原生 Eino + 单一 Work 聚合</text>
<text x="56" y="337" font-size="16" font-weight="400" fill="#6b7280">Eino：Runner / checkpoint / resume；Work：Task / Goal / Run / Wait / Review</text>
<text x="56" y="361" font-size="16" font-weight="400" fill="#6b7280">Chat、六个 Owner、Review、表达与交付协作；权限、来源、预算和幂等仍由 Host 校验。</text>
<path d="M600 412 V472" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<path d="M108 472 H1092" stroke="#2563eb" stroke-width="2" fill="none"/>
<path d="M108 472 V512" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="40" y="512" width="136" height="96" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="52" y="543" font-size="18" font-weight="600" fill="#111827">Config</text>
<text x="52" y="576" font-size="13" font-weight="400" fill="#6b7280">版本配置</text>
<path d="M272 472 V512" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="204" y="512" width="136" height="96" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="216" y="543" font-size="18" font-weight="600" fill="#111827">Messages</text>
<text x="216" y="576" font-size="13" font-weight="400" fill="#6b7280">原始消息 / 缺口</text>
<path d="M436 472 V512" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="368" y="512" width="136" height="96" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="380" y="543" font-size="18" font-weight="600" fill="#111827">Resources</text>
<text x="380" y="576" font-size="13" font-weight="400" fill="#6b7280">版本 / hash / 字节</text>
<path d="M600 472 V512" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="532" y="512" width="136" height="96" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="544" y="543" font-size="18" font-weight="600" fill="#111827">Tools</text>
<text x="544" y="576" font-size="13" font-weight="400" fill="#6b7280">原生只读工具</text>
<path d="M764 472 V512" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="696" y="512" width="136" height="96" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="708" y="543" font-size="18" font-weight="600" fill="#111827">Files</text>
<text x="708" y="576" font-size="13" font-weight="400" fill="#6b7280">Task / Run 清单</text>
<path d="M928 472 V512" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="860" y="512" width="136" height="96" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="872" y="543" font-size="18" font-weight="600" fill="#111827">Executor</text>
<text x="872" y="576" font-size="13" font-weight="400" fill="#6b7280">原子 Run 事实</text>
<path d="M1092 472 V512" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="1024" y="512" width="136" height="96" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="1036" y="543" font-size="18" font-weight="600" fill="#111827">Delivery</text>
<text x="1036" y="576" font-size="13" font-weight="400" fill="#6b7280">Target / 回执</text>
<text x="56" y="391" font-size="16" font-weight="400" fill="#6b7280">窄接口按组覆盖；可信 Call、业务 Scope、投递 Target 分开，保留明确版本与原始事实。</text>
<path d="M108 608 V680" fill="none" stroke="#059669" stroke-width="1.5"/>
<path d="M272 608 V680" fill="none" stroke="#059669" stroke-width="1.5"/>
<path d="M436 608 V680" fill="none" stroke="#059669" stroke-width="1.5"/>
<path d="M600 608 V680" fill="none" stroke="#059669" stroke-width="1.5"/>
<path d="M764 608 V680" fill="none" stroke="#059669" stroke-width="1.5"/>
<path d="M928 608 V680" fill="none" stroke="#059669" stroke-width="1.5"/>
<path d="M1092 608 V680" fill="none" stroke="#059669" stroke-width="1.5"/>
<path d="M108 680 H1092" fill="none" stroke="#059669" stroke-width="1.5"/>
<path d="M400 680 V752" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
<rect x="412" y="703" width="120" height="26" rx="4" fill="#ffffff" opacity=".97"/>
<text x="417" y="721" font-size="15" font-weight="400" fill="#6b7280">默认本地实现</text>
<path d="M1000 680 V752" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)" stroke-dasharray="5 3"/>
<rect x="1012" y="703" width="123" height="26" rx="4" fill="#ffffff" opacity=".97"/>
<text x="1017" y="721" font-size="15" font-weight="400" fill="#6b7280">覆盖选定能力</text>
<rect x="40" y="752" width="720" height="112" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="56" y="781" font-size="20" font-weight="600" fill="#111827">SQLite + Markdown + Local Executor</text>
<text x="56" y="809" font-size="16" font-weight="400" fill="#6b7280">真实事务、来源、文件和恢复；既有 Outbox 保存本地交付。</text>
<text x="56" y="833" font-size="16" font-weight="400" fill="#6b7280">local_applied / local-file 明确标识；不冒充钉钉送达。</text>
<rect x="840" y="752" width="320" height="112" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="856" y="781" font-size="20" font-weight="600" fill="#111827">可选远端 Adapter</text>
<text x="856" y="809" font-size="16" font-weight="400" fill="#6b7280">按实际版本映射接口与身份</text>
<text x="856" y="833" font-size="16" font-weight="400" fill="#6b7280">保留查询、取消及回执语义</text>
<text x="40" y="906" font-size="18" font-weight="600" fill="#111827">provider_accepted → 持久等待 Lookup → delivered；未知结果不盲目重发。</text>
<text x="40" y="939" font-size="17" font-weight="400" fill="#6b7280">完整 Task 服务和原子执行接口各有边界；不在本地 Run 下再创建另一套业务 Task。</text>
<text x="40" y="970" font-size="17" font-weight="400" fill="#6b7280">更深的内部替换仍可用 entry.Open 的精确版本工厂；每个工厂只获得最小依赖。</text>
<path d="M40 1010 H70" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<text x="82" y="1015" font-size="14" font-weight="400" fill="#6b7280">业务调用</text>
<path d="M240 1010 H270" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
<text x="282" y="1015" font-size="14" font-weight="400" fill="#6b7280">默认本地能力</text>
<path d="M490 1010 H520" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)" stroke-dasharray="5 3"/>
<text x="532" y="1015" font-size="14" font-weight="400" fill="#6b7280">显式远端替换</text>
</svg>
