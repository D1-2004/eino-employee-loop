<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1170" width="1200" height="1170">
<style>text{font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;fill:#111827}</style>
<defs>
<marker id="blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#2563eb"/></marker>
<marker id="green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#059669"/></marker>
<marker id="purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#7c3aed"/></marker>
</defs>
<rect width="1200" height="1170" fill="white"/>
<text x="40" y="48" font-size="30" font-weight="600" fill="#111827">Employee Loop · 目录就是模块边界</text>
<text x="40" y="81" font-size="18" font-weight="400" fill="#6b7280">七个模块与既定业务架构一一对应；通用内核、外部端口和具体适配独立。</text>
<rect x="40" y="132" width="360" height="96" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="56" y="161" font-size="20" font-weight="600" fill="#111827">默认应用 · app/local</text>
<text x="56" y="189" font-size="16" font-weight="400" fill="#6b7280">选择 SQLite / Markdown / Eino</text>
<text x="56" y="213" font-size="16" font-weight="400" fill="#6b7280">cmd/el 只有一个产品入口</text>
<rect x="480" y="132" width="680" height="96" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="496" y="161" font-size="20" font-weight="600" fill="#111827">M7 Entry · modules/entry</text>
<text x="496" y="189" font-size="16" font-weight="400" fill="#6b7280">配置、依赖接线、版本选择、启动、关闭与恢复调度</text>
<text x="496" y="213" font-size="16" font-weight="400" fill="#6b7280">不定义业务提示词，不拥有其他模块的私有状态</text>
<path d="M400 180 H480" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="415" y="133" width="52" height="25" rx="3" fill="white" opacity=".97"/>
<text x="419" y="151" font-size="15" font-weight="400" fill="#6b7280">装配</text>
<path d="M820 228 V276 H600 V352" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="840" y="245" width="162" height="25" rx="3" fill="white" opacity=".97"/>
<text x="844" y="263" font-size="15" font-weight="400" fill="#6b7280">装配并推进各模块</text>
<rect x="40" y="316" width="1120" height="382" rx="12" fill="none" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="60" y="352" width="300" height="116" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="76" y="381" font-size="20" font-weight="600" fill="#111827">M1 Chat</text>
<text x="76" y="409" font-size="16" font-weight="400" fill="#6b7280">modules/chat</text>
<text x="76" y="433" font-size="16" font-weight="400" fill="#6b7280">准入、对话、工具、中断恢复</text>
<rect x="450" y="352" width="300" height="116" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="466" y="381" font-size="20" font-weight="600" fill="#111827">M2 Task</text>
<text x="466" y="409" font-size="16" font-weight="400" fill="#6b7280">modules/task</text>
<text x="466" y="433" font-size="16" font-weight="400" fill="#6b7280">Task 状态、Review、发生项</text>
<rect x="840" y="352" width="300" height="116" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="856" y="381" font-size="20" font-weight="600" fill="#111827">M5 Execution</text>
<text x="856" y="409" font-size="16" font-weight="400" fill="#6b7280">modules/execution</text>
<text x="856" y="433" font-size="16" font-weight="400" fill="#6b7280">提交、查询、取消、原生执行</text>
<rect x="60" y="532" width="300" height="116" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="76" y="561" font-size="20" font-weight="600" fill="#111827">M3 Context</text>
<text x="76" y="589" font-size="16" font-weight="400" fill="#6b7280">modules/context</text>
<text x="76" y="613" font-size="16" font-weight="400" fill="#6b7280">引用、上下文、受众与撤回</text>
<rect x="450" y="532" width="300" height="116" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="466" y="561" font-size="20" font-weight="600" fill="#111827">M4 Owner</text>
<text x="466" y="589" font-size="16" font-weight="400" fill="#6b7280">modules/owner</text>
<text x="466" y="613" font-size="16" font-weight="400" fill="#6b7280">六角色加工、证据、投影</text>
<rect x="840" y="532" width="300" height="116" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="856" y="561" font-size="20" font-weight="600" fill="#111827">M6 Interaction</text>
<text x="856" y="589" font-size="16" font-weight="400" fill="#6b7280">modules/interaction</text>
<text x="856" y="613" font-size="16" font-weight="400" fill="#6b7280">表达、打包、Outbox、回执</text>
<path d="M360 409 H450" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="378" y="365" width="52" height="25" rx="3" fill="white" opacity=".97"/>
<text x="382" y="383" font-size="15" font-weight="400" fill="#6b7280">命令</text>
<path d="M750 409 H840" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="777" y="365" width="45" height="25" rx="3" fill="white" opacity=".97"/>
<text x="781" y="383" font-size="15" font-weight="400" fill="#6b7280">Run</text>
<path d="M210 468 V532" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
<rect x="222" y="484" width="70" height="25" rx="3" fill="white" opacity=".97"/>
<text x="226" y="502" font-size="15" font-weight="400" fill="#6b7280">读视图</text>
<path d="M450 590 H360" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
<rect x="377" y="545" width="60" height="25" rx="3" fill="white" opacity=".97"/>
<text x="381" y="563" font-size="15" font-weight="400" fill="#6b7280">投影</text>
<path d="M300 468 V500 H600 V532" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
<rect x="388" y="475" width="104" height="25" rx="3" fill="white" opacity=".97"/>
<text x="392" y="493" font-size="15" font-weight="400" fill="#6b7280">入站证据</text>
<path d="M750 440 H794 V590 H840" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<rect x="758" y="500" width="76" height="25" rx="3" fill="white" opacity=".97"/>
<text x="762" y="518" font-size="15" font-weight="400" fill="#6b7280">任务事件</text>
<text x="64" y="678" font-size="16" font-weight="400" fill="#6b7280">M2/state 是唯一业务状态；执行退出、目标完成、消息送达分别核验。</text>
<path d="M600 698 V768" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
<rect x="612" y="718" width="170" height="25" rx="3" fill="white" opacity=".97"/>
<text x="616" y="736" font-size="15" font-weight="400" fill="#6b7280">使用通用运行能力</text>
<rect x="40" y="768" width="1120" height="106" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="56" y="797" font-size="20" font-weight="600" fill="#111827">kernel · 通用 Eino 底座</text>
<text x="56" y="825" font-size="16" font-weight="400" fill="#6b7280">eino / decision / journal / workflow / generation / event</text>
<text x="56" y="849" font-size="16" font-weight="400" fill="#6b7280">Runner、checkpoint/resume、原生工具绑定和账本；不导入业务模块。</text>
<rect x="40" y="950" width="520" height="106" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
<text x="56" y="979" font-size="20" font-weight="600" fill="#111827">ports · 外部合同</text>
<text x="56" y="1007" font-size="16" font-weight="400" fill="#6b7280">services：配置、消息、资源、工具、文件</text>
<text x="56" y="1031" font-size="16" font-weight="400" fill="#6b7280">storage：事务、租约、checkpoint、文件</text>
<rect x="640" y="950" width="520" height="106" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="656" y="979" font-size="20" font-weight="600" fill="#111827">adapters · 具体实现</text>
<text x="656" y="1007" font-size="16" font-weight="400" fill="#6b7280">storage / services / channel / sessionfile</text>
<text x="656" y="1031" font-size="16" font-weight="400" fill="#6b7280">默认实现由 app/local 选择并注入</text>
<path d="M300 874 V950" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
<rect x="313" y="902" width="77" height="25" rx="3" fill="white" opacity=".97"/>
<text x="317" y="920" font-size="15" font-weight="400" fill="#6b7280">接口依赖</text>
<path d="M640 1003 H560" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)" stroke-dasharray="5 3"/>
<rect x="578" y="960" width="51" height="25" rx="3" fill="white" opacity=".97"/>
<text x="582" y="978" font-size="15" font-weight="400" fill="#6b7280">实现</text>
<text x="40" y="1100" font-size="17" font-weight="400" fill="#6b7280">模块禁止反向依赖 Entry/app/adapters；M7 不依赖具体 adapter。以上边界由架构测试检查。</text>
<path d="M40 1140 H72" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue)"/>
<text x="84" y="1145" font-size="14" font-weight="400" fill="#6b7280">命令 / 事实</text>
<path d="M300 1140 H332" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#green)"/>
<text x="344" y="1145" font-size="14" font-weight="400" fill="#6b7280">视图 / 接口</text>
<path d="M570 1140 H602" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#purple)"/>
<text x="614" y="1145" font-size="14" font-weight="400" fill="#6b7280">触发 / 通用能力</text>
</svg>
